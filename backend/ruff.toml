# ruff 설정 — 린터(`ruff check`)와 포매터(`ruff format`)가 함께 읽습니다.
#
# 규칙 목록을 직접 고르지 않고 ruff 기본값을 씁니다. 지금 코드에서 나오는
# 지적이 20여 건뿐이라 기본값으로 충분하고, 팀이 규칙을 두 벌로 관리하지
# 않게 하려는 것입니다. 늘리거나 줄일 일이 생기면 여기에 `lint.select`를
# 적습니다.
#
# 버전은 `requirements-dev.in`에 `ruff>=0.16,<0.17`로 고정했습니다.
# 마이너 버전이 오르며 기본 규칙이 늘면, 손대지 않은 PR이 갑자기
# 실패하기 때문입니다.

# Dockerfile(python:3.12-slim)과 의존성 컴파일 대상에 맞춥니다.
target-version = "py312"
