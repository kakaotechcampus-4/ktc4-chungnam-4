<rect x="530" y="790" width="620" height="100" rx="18" fill="#ffffff" stroke="#b9cce5" stroke-width="2"/>
<text x="840" y="831" font-size="29" fill="#436a9f" style="fill:#436a9f" font-weight="700" text-anchor="middle">하루 일과 / 기간별 관찰 요약</text>
<text x="840" y="868" font-size="24" fill="#5b697d" style="fill:#5b697d" font-weight="400" text-anchor="middle">사실마다 원본 근거 E1… 참조를 보존</text>
