<text x="936" y="1104" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">도구 조회: 영역 스타일 · 발달 지침</text>
<text x="936" y="1141" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">5영역·종합의견 중 근거 있는 영역 작성</text>
<text x="936" y="1178" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">격식체로 작성하고 원본 근거 참조를 유지</text>
