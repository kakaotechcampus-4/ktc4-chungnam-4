<path d="M 840 460 H 1404 V 540" fill="none" stroke="#7b57b0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#purple)" stroke-dasharray="8 7"/>
<rect x="530" y="540" width="620" height="190" rx="18" fill="#f0f5fd" stroke="#436a9f" stroke-width="2"/>
