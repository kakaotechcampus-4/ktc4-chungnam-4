<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2220" viewBox="0 0 1680 2220" role="img" aria-labelledby="title desc">
<title id="title">아이담 멀티에이전트 구조 — PR 259</title>
<desc id="desc">일별 알림장은 근거 수집 Agent1에서 요약 후 Agent3로, 월별 관찰일지는 Agent2로 분기한다. 코드 검사를 통과하면 별도 대화의 Agent4 Critic이 요약 전 비식별 원본 근거로 검증한다. 통과한 초안은 교사 검토와 승인을 거친다. 알림장만 게시 후 연결된 학부모가 열람하며 관찰일지는 교사가 승인하고 보관한다. 오류 시 작성은 최대 두 번 재생성하고 Critic 응답 오류는 Critic만 한 번 재시도한다.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526078"/></marker>
 <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b57b0"/></marker>
 <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb662f"/></marker>
 <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#202d43} .muted{fill:#5b697d}</style>
</defs>
<rect width="1680" height="2220" fill="#ffffff"/>

<text x="64" y="73" font-size="50" fill="#202d43" style="fill:#202d43" font-weight="700" text-anchor="start">아이담 멀티에이전트 구조</text>
<text x="64" y="119" font-size="28" fill="#526078" style="fill:#526078" font-weight="600" text-anchor="start">일별 알림장  1 → 3 → 4     /     월별 관찰일지  1 → 2 → 4</text>
<rect x="64" y="154" width="1552" height="76" rx="14" fill="#edf2f7" stroke="#edf2f7" stroke-width="2"/>
<text x="90" y="200" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="600" text-anchor="start">코드 처리: 권한·기간 확인  /  사진 동의·귀속 확인  /  비식별화  /  API → Redis → Celery</text>
<rect x="96" y="274" width="680" height="126" rx="18" fill="#f3faf7" stroke="#bbdccf" stroke-width="2"/>
<text x="126" y="317" font-size="31" fill="#24795d" style="fill:#24795d" font-weight="700" text-anchor="start">일별 알림장 입력</text>
<text x="126" y="354" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">사진 분석 결과 + 교사가 검수한 발화</text>
<text x="126" y="384" font-size="21" fill="#5b697d" style="fill:#5b697d" font-weight="400" text-anchor="start">얼굴 분류는 브라우저 · STT는 서버에서 처리</text>
<rect x="904" y="274" width="680" height="126" rx="18" fill="#f2f6fe" stroke="#bfd1ee" stroke-width="2"/>
<text x="934" y="317" font-size="31" fill="#3869aa" style="fill:#3869aa" font-weight="700" text-anchor="start">월별 관찰일지 입력</text>
<text x="934" y="354" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">교사가 고른 월의 게시 중인 알림장</text>
<text x="934" y="384" font-size="21" fill="#5b697d" style="fill:#5b697d" font-weight="400" text-anchor="start">0건은 시작 차단 · 생성·저장 시 게시 상태 확인</text>
<rect x="56" y="468" width="1568" height="1182" rx="24" fill="#fafbfd" stroke="#dbe3ed" stroke-width="2" stroke-dasharray="9 7"/>
<text x="84" y="510" font-size="22" fill="#5b697d" style="fill:#5b697d" font-weight="600" text-anchor="start">CELERY WORKER  ·  요청별 실행 · 상태와 도구 경로 기록</text>
