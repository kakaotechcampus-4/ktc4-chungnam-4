<text x="1248" y="624" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">요약 전 비식별 근거</text>
<text x="1248" y="660" font-size="25" fill="#202d43" style="fill:#202d43" font-weight="400" text-anchor="start">원본 참조를 그대로 유지</text>
<text x="1248" y="702" font-size="22" fill="#7451a3" style="fill:#7451a3" font-weight="600" text-anchor="start">Critic에 별도로 전달</text>
