# develop에 머지되면 EC2에 배포합니다 (NFR-13).
#
# 흐름: GitHub Actions → OIDC 인증 → AWS SSM → EC2에서 deploy.sh 실행
# 서버에 러너를 상시 띄우지 않고, AWS 액세스 키도 쓰지 않습니다 (NFR-14).
#
# 실제 배포 절차는 backend/scripts/deploy.sh 에 있습니다. 여기서는 그 스크립트를
# 원격으로 호출하고 결과를 기다릴 뿐입니다 — 서버에서 손으로 돌릴 때와 같은
# 절차를 쓰려는 것입니다.
name: Deploy to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 토큰 발급. 빠지면 AWS 인증이 실패합니다
  contents: write   # 배포 태그 push (NFR-15)

# 배포가 겹치면 서버에서 docker compose가 동시에 돌아 상태가 꼬입니다.
# 앞 배포가 끝날 때까지 기다리고, 취소하지 않습니다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-03904421d4361bffa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 명령 전송
        id: send
        run: |
          # 서버에서 ubuntu 사용자로 실행합니다. root로 돌리면 .env와 도커
          # 산출물이 root 소유가 되어 팀원이 손으로 다룰 때 막힙니다.
          # origin/develop이 아니라 이 워크플로를 띄운 커밋으로 고정합니다 —
          # 배포 도중 새 커밋이 들어와도 무엇이 올라갔는지 분명해집니다.
          SCRIPT="set -e
          cd /opt/aidam/app
          git fetch --prune origin
          git reset --hard ${GITHUB_SHA}
          bash backend/scripts/deploy.sh"

          # 스크립트를 따옴표 안에 그대로 끼워 넣으면 값에 따옴표가 섞이는 순간
          # 명령이 조용히 깨집니다. base64로 실어 보내면 문자 집합에 따옴표가
          # 없어 안전하고, 서버에서 실행할 명령은 변수 없는 고정 문자열이 됩니다.
          ENCODED=$(printf '%s' "$SCRIPT" | base64 -w0)

          REMOTE="set -e
          trap 'rm -f /tmp/aidam-deploy.sh' EXIT
          umask 077
          printf '%s' '${ENCODED}' | base64 -d > /tmp/aidam-deploy.sh
          chown ubuntu:ubuntu /tmp/aidam-deploy.sh
          runuser -l ubuntu -c 'bash /tmp/aidam-deploy.sh'"

          PARAMS=$(jq -n --arg s "$REMOTE" '{commands: [$s]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "CommandId: $COMMAND_ID"

      - name: 배포 완료 대기
        id: wait
        run: |
          # 빌드가 오래 걸려 aws ssm wait는 못 씁니다(최대 100초). 직접 폅니다.
          #
          # 조회 실패를 전부 "아직 진행 중"으로 삼키면, 권한이 없을 때도 20분을
          # 채우고서야 실패합니다. 명령이 아직 등록되지 않은 경우만 재시도하고
          # 나머지 오류는 즉시 멈춥니다.
          STATUS=Pending
          for _ in $(seq 1 120); do
            if OUT=$(aws ssm get-command-invocation \
                --command-id "${{ steps.send.outputs.command_id }}" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status --output text 2>&1); then
              STATUS="$OUT"
            elif printf '%s' "$OUT" | grep -q InvocationDoesNotExist; then
              STATUS=Pending   # 전달 직후 잠시 나타납니다
            else
              echo "명령 상태를 조회하지 못했습니다:"
              echo "$OUT"
              exit 1
            fi
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "최종 상태: $STATUS"

      - name: 서버 로그 출력
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- 표준 에러 -----"
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true

      - name: 실패하면 워크플로도 실패시키기
        if: steps.wait.outputs.status != 'Success'
        run: |
          echo "배포 실패 (상태: ${{ steps.wait.outputs.status }})"
          exit 1

      # 태그 생성이 실패해도 배포 자체는 성공입니다. 워크플로를 빨간불로
      # 만들면 다음 사람이 배포가 실패한 줄 압니다.
      - name: 배포 태그 남기기
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // NFR-15: 배포된 버전을 태그로 식별해 그 코드로 되돌릴 수 있게 합니다.
            // 서버의 옛 이미지는 배포가 아니라 EC2의 cron이 매일 04:00에
            // 정리합니다(docker system prune -af --filter until=168h).
            // 이미지가 없어져도 태그가 있으면 그 커밋으로 다시 빌드할 수 있습니다.
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000);  // KST
            const stamp = now.toISOString().slice(0, 16).replace(/[-T:]/g, '').replace(/(\d{8})(\d{4})/, '$1-$2');
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/deploy-${stamp}`,
              sha: context.sha,
            });
            core.info(`태그 생성: deploy-${stamp}`);
