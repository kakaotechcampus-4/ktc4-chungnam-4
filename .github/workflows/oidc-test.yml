# GitHub Actions가 AWS에 붙을 수 있는지, 그리고 배포에 필요한 권한이
# 붙어 있는지 확인만 하는 워크플로입니다. 배포는 하지 않습니다.
# 결과에 따라 배포 방식(SSM 원격 실행 / self-hosted 러너)이 갈립니다.
name: OIDC 연결 확인

on:
  workflow_dispatch:

# id-token이 없으면 OIDC 토큰이 발급되지 않아 인증이 실패합니다.
# permissions 블록을 쓰는 순간 나머지 권한은 전부 none이 되므로
# checkout용 contents: read도 함께 명시합니다.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-03904421d4361bffa

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 인증 확인
        run: aws sts get-caller-identity

      # 아래 호출들은 실패해도 워크플로를 멈추지 않습니다.
      # "무엇이 되고 무엇이 안 되는지" 목록을 한 번에 얻는 것이 목적입니다.
      - name: 역할 권한 탐색
        run: |
          echo "===== SSM: 인스턴스 조회 ====="
          aws ssm describe-instance-information \
            --query 'InstanceInformationList[].[InstanceId,PingStatus]' --output text \
            || echo "NO ssm:DescribeInstanceInformation"

          echo "===== SSM: 원격 명령 실행 (배포 경로 결정) ====="
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo deploy-path-ok"]' \
            --query 'Command.CommandId' --output text \
            || echo "NO ssm:SendCommand"

          echo "===== ECR ====="
          aws ecr describe-repositories --output text \
            || echo "NO ecr:DescribeRepositories"

          echo "===== S3 ====="
          aws s3 ls || echo "NO s3:ListAllMyBuckets"
