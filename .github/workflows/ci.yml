# PR이 올라올 때 백엔드 테스트와 린트를 돌려, 기존 테스트를 깨뜨리거나
# 컨벤션을 벗어난 코드가 develop에 들어가지 않게 막습니다 (멘토 리뷰 09/20).
#
# ⚠️ paths 필터를 넣지 않습니다. 브랜치 보호의 required check로 등록하면,
#    필터에 걸려 실행되지 않은 PR이 "검사 대기 중"에서 영원히 멈춥니다.
#    문서만 고친 PR에서도 그냥 돌리고 30초 만에 끝나게 두는 편이 낫습니다.
#
# 파트별로 job을 나눕니다. backend는 ruff·pytest, frontend는 Prettier·ESLint·tsc·Vitest·빌드입니다.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR에 연달아 push하면 이전 실행을 취소합니다. 결과가 뒤집히는 것을
# 막고 Actions 사용량도 아낍니다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Dockerfile(python:3.12-slim)과 의존성 컴파일 대상에 맞춥니다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 린트를 테스트보다 먼저 돌립니다. 몇 초 만에 끝나서 빨리 실패합니다.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # 이 테스트들은 DB 없이 돕니다. .env·PostgreSQL에 의존하게 되면
      # 여기에 서비스 컨테이너를 붙여야 합니다.
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    # 설치와 검사가 1분 안에 끝납니다. 넘으면 캐시나 의존성을 의심합니다.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 frontend/package.json의 packageManager에서 읽습니다.
      # setup-node의 cache: pnpm이 동작하려면 이 단계가 먼저 와야 합니다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 빠른 검사부터 돌립니다. 포맷·린트는 몇 초 만에 끝납니다.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
