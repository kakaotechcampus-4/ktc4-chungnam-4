# PR마다 화면·API·DB·Redis·Celery worker·S3(SeaweedFS)를 실제로 연결해 E2E를 돌립니다.
# 외부 AI만 가짜 서버(frontend/e2e/fake-llm)로 바꿉니다. 실제 모델·키는 쓰지 않습니다.
#
# ci.yml과 분리한 이유: 브라우저·컨테이너를 띄워 몇 분이 걸리고, 필수 검사(develop-ci 룰셋)로
# 걸지 여부는 아직 팀 결정 전입니다(docs/open-questions.md "CI에서 막을 것").
# 필수 검사로 등록할 수 있도록 ci.yml과 같은 이유로 paths 필터를 넣지 않습니다.
#
# 실패하면 Actions 실행 화면의 Artifacts에서 playwright-report(화면 캡처·영상·trace)를 받아
# `pnpm exec playwright show-report <폴더>`로 엽니다. 실행 방법은 frontend/e2e/README.md.
name: E2E

on:
  pull_request:
    branches: [develop-next, develop, main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 설치 3~4분 + 테스트 1분 안팎입니다. 넘으면 캐시나 서버 기동을 의심합니다.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Dockerfile(python:3.12-slim)과 같은 버전입니다. API·worker는 컨테이너가 아니라 러너에서 돕니다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start infrastructure
        run: docker compose -f e2e/docker-compose.yml up -d --wait

      - name: Run E2E
        run: pnpm test:e2e
        env:
          E2E_PYTHON: python

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop infrastructure
        if: always()
        run: docker compose -f e2e/docker-compose.yml down --volumes
