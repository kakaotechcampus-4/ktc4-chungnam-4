name: Claude review
# PR 본문이나 PR 코멘트에 @claude 가 있을 때만 리뷰한다.
# 리뷰 기준·출력 형식은 .github/claude-review.md 에 있다.
#
# ⭐ pull_request 는 opened 만 잡는다. 재리뷰는 PR 작성자가 코멘트에 @claude 를 쓸 때만 돈다.
#   synchronize 를 넣으면 push 마다, edited 를 넣으면 본문 수정마다 다시 돈다.
#   리뷰마다 새 코멘트를 단다(이력 보존).
# ⭐ branches: [develop] — 멘토 리뷰용 develop → main PR 에는 돌지 않는다.
#   issue_comment·pull_request_review_comment 는 branches 필터를 지원하지 않아 job-level if 로 거른다.
# ⭐ contents: read — Claude 는 코멘트만 달고 코드를 고치거나 push 하지 못한다.
#   코드를 쓴 AI 가 스스로 검증하면 편향되므로, 리뷰 모델도 작성용과 다르게 둔다.
# ⭐ github_token 을 넘긴다 — Claude GitHub App 은 조직 승인이 필요해 설치하지 못했다.
#   그래서 코멘트 작성자는 github-actions 로 표시된다.

on:
  pull_request:
    types: [opened]
    branches: [develop]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.body, '@claude')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.event.issue.user.login) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 팀 키는 Anthropic 직접 키가 아니라 LLM 게이트웨이 토큰이다(backend/.env 와 같은 값).
      # 시크릿 값은 .env 처럼 /v1 로 끝나고, Claude Code 는 base URL 뒤에 /v1/messages 를 붙이므로 /v1 을 뗀다.
      - name: Point Claude Code at LLM gateway
        env:
          GATEWAY_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
        run: echo "ANTHROPIC_BASE_URL=${GATEWAY_URL%/v1}" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          # 게이트웨이에 없는 모델 이름으로 보조 호출이 나가지 않게 전부 같은 모델로 둔다.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-sonnet-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-sonnet-5
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # pull_request 이벤트는 기본이 agent 모드라 본문의 @claude 를 보지 않는다. tag 모드를 강제한다.
          track_progress: true
          claude_args: |
            --model anthropic/claude-sonnet-5
            --max-turns 15
            --disallowedTools Edit,Write,NotebookEdit
            --append-system-prompt "PR 리뷰는 .github/claude-review.md 의 기준과 출력 형식을 따른다."
