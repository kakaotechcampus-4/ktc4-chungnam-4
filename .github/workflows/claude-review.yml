name: Claude review
# PR 본문이나 PR 코멘트에 @claude 가 있을 때만 리뷰한다.
# 리뷰 기준·출력 형식은 .github/claude-review.md 에 있다.
#
# ⭐ pull_request 는 opened·reopened 만 잡는다. 재리뷰는 PR 작성자가 코멘트에 @claude 를 쓸 때만 돈다.
#   synchronize 를 넣으면 push 마다, edited 를 넣으면 본문 수정마다 다시 돈다.
#   리뷰마다 새 코멘트를 단다(이력 보존).
# ⭐ 비용 — 게이트웨이 크레딧을 앱과 나눠 쓴다(1회 약 $0.5 실측, 2026-09-27).
#   PR 템플릿에 @claude 를 넣지 않아 필요한 PR 만 작성자가 직접 부른다.
#   CI 로그 조사(github_ci MCP)를 막는다 — 첫 실측에서 이전 실패 로그를 뒤지느라 턴을 썼다.
#   --max-turns 는 폭주 방지용이다. 턴을 줄여도 비용이 거의 안 준다(실측: 15턴 $0.50 / 8턴 $0.35 / 5턴 $0.32) —
#   매 턴 시스템 프롬프트·도구 목록이 기본으로 실려 1회 약 $0.3 이 바닥이다.
#   상한은 15 다. 10 이면 문서를 여는 PR(#61)·큰 PR(#65)에서 리뷰를 쓰기 전에 멈췄다(2026-09-28).
#   원인은 상한보다 턴 쓰는 방식이었다 — 파일 하나·진행 체크박스 하나마다 턴을 썼다. 그래서 claude-review.md §범위에서
#   체크리스트 금지, 병렬 읽기, 300줄 초과 시 하드룰 파일만 보기를 정했다.
#   상한에 걸리면 action 이 리뷰를 게시하고도 실패로 표시하므로, 마지막 단계에서 리뷰가 실제로 달린 경우만 성공으로 돌린다.
# ⭐ branches: [develop] — PR 을 열 때의 리뷰는 develop 대상 PR 에만 돈다.
#   issue_comment·pull_request_review_comment 는 branches 필터가 없어 base 를 거르지 못한다.
#   develop → main PR 에서도 작성자가 직접 @claude 를 쓰면 돈다(의도한 호출로 본다).
# ⭐ contents: read — Claude 는 코멘트만 달고 코드를 고치거나 push 하지 못한다.
#   코드를 쓴 AI 가 스스로 검증하면 편향되므로, 리뷰 모델도 작성용과 다르게 둔다.
# ⭐ github_token 을 넘긴다 — Claude GitHub App 은 조직 승인이 필요해 설치하지 못했다.
#   그래서 코멘트 작성자는 github-actions 로 표시된다.

on:
  pull_request:
    types: [opened, reopened]
    branches: [develop]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && contains(github.event.pull_request.body, '@claude')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.event.issue.user.login) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request 는 ref 를 비워 기본값(PR merge ref)을 쓴다.
      # issue_comment·pull_request_review_comment 는 기본값이 기본 브랜치라, PR head 를 직접 지정한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && format('refs/pull/{0}/head', github.event.issue.number || github.event.pull_request.number) || '' }}
          fetch-depth: 1

      # 팀 키는 Anthropic 직접 키가 아니라 LLM 게이트웨이 토큰이다(backend/.env 와 같은 값).
      # 시크릿 값은 .env 처럼 /v1 로 끝나고, Claude Code 는 base URL 뒤에 /v1/messages 를 붙이므로 /v1 을 뗀다.
      - name: Point Claude Code at LLM gateway
        env:
          GATEWAY_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
        run: |
          echo "::add-mask::${GATEWAY_URL%/v1}"
          echo "ANTHROPIC_BASE_URL=${GATEWAY_URL%/v1}" >> "$GITHUB_ENV"
          # 마지막 단계가 이 시각 이후에 달린 리뷰만 인정한다.
          echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - id: claude
        uses: anthropics/claude-code-action@v1
        # 턴 상한 초과는 리뷰가 달렸을 때만 아래 단계에서 성공으로 돌린다. 그 외 실패는 아래 단계가 다시 실패시킨다.
        continue-on-error: true
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          # 게이트웨이에 없는 모델 이름으로 보조 호출이 나가지 않게 전부 같은 모델로 둔다.
          # sonnet-5-5 는 단가가 sonnet-5 와 같고 성능이 좋아 턴 상한에 덜 걸릴 것으로 보고 바꿨다(PR 리뷰 제안, 2026-10-02).
          # 게이트웨이 지원 여부는 아직 확인 전이다 — 첫 실행이 모델 오류로 실패하면 sonnet-5 로 되돌린다.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-sonnet-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-sonnet-5-5
          # 게이트웨이가 모르는 anthropic-beta 헤더를 보내지 않는다.
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # pull_request 이벤트는 기본이 agent 모드라 본문의 @claude 를 보지 않는다. tag 모드를 강제한다.
          track_progress: true
          claude_args: |
            --model anthropic/claude-sonnet-5-5
            --max-turns 15
            --disallowedTools Edit,Write,NotebookEdit,mcp__github_ci
            --append-system-prompt "PR 리뷰는 .github/claude-review.md 의 기준과 출력 형식을 따른다. 진행 체크리스트를 만들거나 갱신하지 말고, 리뷰를 다 쓴 뒤 코멘트를 한 번만 갱신한다."

      # 턴 상한에 걸렸어도 리뷰가 실제로 달렸으면 통과시킨다.
      # 리뷰 없이 멈췄거나(#61) 인증·네트워크 등 다른 이유로 실패했으면 그대로 실패시킨다.
      - name: Treat turn cap as success
        if: steps.claude.outcome == 'failure'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          f="${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          # 마지막 result 이벤트: "error_max_turns ..." = 상한에서 멈춤, "success false" = 끝냈지만 상한을 넘겨 action 이 실패 처리
          r=$(jq -r '[.[]? | select(.type == "result")] | last | "\(.subtype) \(.is_error)"' "$f" 2>/dev/null || true)
          case "$r" in
            "error_max_turns "*|"success false") ;;
            *)
              echo "::error::Claude 실행이 턴 상한 외의 이유로 실패했습니다. 위 단계 로그를 확인하세요."
              exit 1 ;;
          esac
          # track_progress 는 진행 코멘트를 리뷰로 덮어쓴다. 이번 실행 이후 갱신된 코멘트에 리뷰 제목이 있는지 본다.
          # 재리뷰가 리뷰 코멘트 스레드에서 불리면 답글로 달리므로 PR 리뷰 코멘트도 함께 본다.
          filter='[.[] | select(.updated_at >= env.REVIEW_STARTED_AT and (.body | contains("🤖 Claude 리뷰")))] | length'
          # --paginate 는 페이지마다 개수를 한 줄씩 내므로 합산한다.
          n=$( { gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq "$filter"
                 gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --jq "$filter"; } \
               | awk '{ s += $1 } END { print s + 0 }' )
          if [ "$n" -gt 0 ]; then
            echo "::warning::턴 상한에 걸렸지만 리뷰는 게시됐습니다 ($r)."
            exit 0
          fi
          echo "::error::리뷰를 게시하기 전에 턴 상한에 걸렸습니다 ($r). PR 에 @claude 를 다시 달아 재시도하세요."
          exit 1
